name: Gate estatico SDD backend
on:
  push:
    branches: ["entrega-professor-emprest-ai-20261105"]
  pull_request:
permissions:
  contents: read
jobs:
  criteria:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/check-ca.mjs
      - run: node --test scripts/practice.test.mjs tests-policy.test.mjs
