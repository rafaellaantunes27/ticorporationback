[project]
name = "dq"
version = "1.0.0"
description = "Validador de qualidade de dados CSV com CLI e API para TI Corporation"
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.0,<3.0",
    "fastapi>=0.110,<1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "httpx>=0.27", "uvicorn>=0.30"]

[project.scripts]
dq = "dq.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
